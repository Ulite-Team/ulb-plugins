[package]
name = "jvm-plugin"
description = "The ulite/jvm plugin: compiles a Java/Kotlin module, packages it into a jar, and runs its tests"
version = "0.6.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulb-plugin-sdk = { path = "../../Uliab/crates/ulb-plugin-sdk" }
wit-bindgen = "0.51"

[lints]
workspace = true
