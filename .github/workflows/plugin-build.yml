name: plugin-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ulb-plugins

      # The plugin's path dep on ulb-plugin-sdk and the `path:` WIT source in
      # `generate!` both resolve relative to the workspace layout this job
      # mirrors from the dev machine: Uliab sits next to ulb-plugins.
      - name: Checkout Uliab (plugin sdk + uliab host)
        uses: actions/checkout@v4
        with:
          repository: Ulite-Team/Uliab
          path: Uliab
          token: ${{ secrets.ULITE_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Build hello-plugin
        working-directory: ulb-plugins
        run: cargo build -p hello-plugin --release --target wasm32-wasip2

      - name: Build the uliab host
        working-directory: Uliab
        run: cargo build -p uliab

      - name: Run the component under the uliab host
        working-directory: Uliab
        run: |
          set +e
          output="$(cargo run -q -p uliab -- run \
            ../ulb-plugins/target/wasm32-wasip2/release/hello_plugin.wasm \
            'hello from CI' 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          grep -q 'hello-plugin says: hello from CI' <<<"$output"

  registry-resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ulb-plugins

      - name: Checkout Uliab (plugin sdk + uliab host)
        uses: actions/checkout@v4
        with:
          repository: Ulite-Team/Uliab
          path: Uliab
          token: ${{ secrets.ULITE_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Build hello-plugin
        working-directory: ulb-plugins
        run: cargo build -p hello-plugin --release --target wasm32-wasip2

      - name: Build the uliab host
        working-directory: Uliab
        run: cargo build -p uliab

      - name: Resolve the plugin through the registry client
        working-directory: Uliab
        run: |
          # The committed index.json points at a release asset that does not
          # exist yet; this job exercises the full resolve path against a
          # local registry seeded from the checkout's build output instead.
          mkdir -p /tmp/reg
          cat > /tmp/reg/index.json <<'JSON'
          {
            "schema_version": 1,
            "plugins": {
              "ulite/hello": {
                "versions": {
                  "0.5.0": {
                    "abi": { "min": "0.7", "max": "0.7" },
                    "artifact_url": "hello_plugin.wasm"
                  }
                }
              }
            }
          }
          JSON
          cp ../ulb-plugins/target/wasm32-wasip2/release/hello_plugin.wasm /tmp/reg/hello_plugin.wasm
          printf 'plugins {\n  hello = "ulite/hello" @ "0.5.0"\n}\n' > /tmp/reg/libs.ulb
          cache="$(mktemp -d)"
          resolve() {
            cargo run -q -p uliab -- plugins resolve --project /tmp/reg \
              --registry /tmp/reg/index.json --cache-dir "$cache"
          }
          first="$(resolve)"
          echo "$first"
          grep -q '(registry)' <<<"$first"
          second="$(resolve)"
          echo "$second"
          grep -q '(cache)' <<<"$second"
          wasm="$(sed -n 's/.*-> \(.*\) (cache).*/\1/p' <<<"$second")"
          output="$(cargo run -q -p uliab -- run "$wasm" 'hello from resolve CI' 2>&1)"
          echo "$output"
          grep -q 'hello-plugin says: hello from resolve CI' <<<"$output"

      - name: Committed index.json is well-formed
        run: jq -e '.schema_version == 1 and (.plugins | type) == "object"' ulb-plugins/registry/index.json >/dev/null

  jvm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ulb-plugins

      - name: Checkout Uliab (plugin sdk + uliab host)
        uses: actions/checkout@v4
        with:
          repository: Ulite-Team/Uliab
          path: Uliab
          token: ${{ secrets.ULITE_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Build jvm-plugin
        working-directory: ulb-plugins
        run: cargo build -p jvm-plugin --release --target wasm32-wasip2

      - name: Build the uliab host
        working-directory: Uliab
        run: cargo build -p uliab

      - name: Install kotlinc
        run: |
          curl -sSLo /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"

      # A Java module with a test suite built end to end: the driver resolves
      # the plugin from a local index, configures it from the module's
      # `jvm {}` block, and executes the javac/java/jar tasks. The test task
      # runs a class whose `main` writes a marker file, so the build's
      # success plus the file's contents prove the runner executed the right
      # program on the right classpath. A second build from a different
      # working directory must come back up-to-date and leave the jar intact,
      # proving the block's relative paths resolved against the project dir.
      - name: Build a Java module with tests into a jar
        working-directory: Uliab
        run: |
          set -euxo pipefail
          mkdir -p /tmp/jvm/src
          cat > /tmp/jvm/src/App.java <<'JAVA'
          public class App {
              public static String hello() {
                  return "hello from the jvm plugin";
              }
          }
          JAVA
          cat > /tmp/jvm/src/AppTest.java <<'JAVA'
          import java.nio.file.Files;
          import java.nio.file.Paths;
          public class AppTest {
              public static void main(String[] args) throws Exception {
                  Files.write(Paths.get("/tmp/jvm/build/test-result.txt"), App.hello().getBytes());
              }
          }
          JAVA
          cat > /tmp/jvm/build.ulb <<'ULB'
          jvm {
            sources = ["src/App.java"]
            classesDir = "build/classes"
            jarFile = "build/app.jar"
            testSources = ["src/AppTest.java"]
            testClassesDir = "build/test-classes"
            testClass = "AppTest"
          }
          ULB
          printf 'plugins {\n  jvm = "ulite/jvm" @ "0.6.0"\n}\n' > /tmp/jvm/libs.ulb
          cp ../ulb-plugins/target/wasm32-wasip2/release/jvm_plugin.wasm /tmp/jvm/jvm_plugin.wasm
          cat > /tmp/jvm/index.json <<'JSON'
          {
            "schema_version": 1,
            "plugins": {
              "ulite/jvm": {
                "versions": {
                  "0.6.0": {
                    "abi": { "min": "0.7", "max": "0.7" },
                    "artifact_url": "jvm_plugin.wasm"
                  }
                }
              }
            }
          }
          JSON
          cache="$(mktemp -d)"
          uliab="$(pwd)/target/debug/uliab"
          build() {
            "$uliab" build --project /tmp/jvm \
              --registry /tmp/jvm/index.json --cache-dir "$cache"
          }
          first="$(build)"
          echo "$first"
          grep -q '4 ran, 0 up-to-date' <<<"$first"
          test -f /tmp/jvm/build/app.jar
          test "$(cat /tmp/jvm/build/test-result.txt)" = "hello from the jvm plugin"
          jar tf /tmp/jvm/build/app.jar | grep -q 'App.class'
          cd /
          second="$(build)"
          echo "$second"
          grep -q '0 ran, 4 up-to-date' <<<"$second"
          # A changed main source reruns the whole chain, tests included.
          sed -i 's/hello from the jvm plugin/hello from a changed source/' /tmp/jvm/src/App.java
          third="$(build)"
          echo "$third"
          grep -q '4 ran, 0 up-to-date' <<<"$third"
          test "$(cat /tmp/jvm/build/test-result.txt)" = "hello from a changed source"

      # A Kotlin-only module: kotlinc compiles the sources and the jar packs
      # them, with no javac task in the chain.
      - name: Build a Kotlin module into a jar
        working-directory: Uliab
        run: |
          set -euxo pipefail
          mkdir -p /tmp/jvm-kotlin/src
          cat > /tmp/jvm-kotlin/src/Main.kt <<'KOTLIN'
          fun main() {
              println("hello from kotlin")
          }
          KOTLIN
          cat > /tmp/jvm-kotlin/build.ulb <<'ULB'
          jvm {
            sources = ["src/Main.kt"]
            classesDir = "build/classes"
            jarFile = "build/app.jar"
          }
          ULB
          printf 'plugins {\n  jvm = "ulite/jvm" @ "0.6.0"\n}\n' > /tmp/jvm-kotlin/libs.ulb
          cp ../ulb-plugins/target/wasm32-wasip2/release/jvm_plugin.wasm /tmp/jvm-kotlin/jvm_plugin.wasm
          cat > /tmp/jvm-kotlin/index.json <<'JSON'
          {
            "schema_version": 1,
            "plugins": {
              "ulite/jvm": {
                "versions": {
                  "0.6.0": {
                    "abi": { "min": "0.7", "max": "0.7" },
                    "artifact_url": "jvm_plugin.wasm"
                  }
                }
              }
            }
          }
          JSON
          cache="$(mktemp -d)"
          uliab="$(pwd)/target/debug/uliab"
          build() {
            "$uliab" build --project /tmp/jvm-kotlin \
              --registry /tmp/jvm-kotlin/index.json --cache-dir "$cache"
          }
          first="$(build)"
          echo "$first"
          grep -q '2 ran, 0 up-to-date' <<<"$first"
          jar tf /tmp/jvm-kotlin/build/app.jar | grep -q 'MainKt.class'

  jvm-scoped-classpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ulb-plugins

      - name: Checkout Uliab (plugin sdk + uliab host)
        uses: actions/checkout@v4
        with:
          repository: Ulite-Team/Uliab
          path: Uliab
          token: ${{ secrets.ULITE_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Build jvm-plugin
        working-directory: ulb-plugins
        run: cargo build -p jvm-plugin --release --target wasm32-wasip2

      - name: Build the uliab host
        working-directory: Uliab
        run: cargo build -p uliab

      # Scoped classpaths end to end: an `implementation` dependency must
      # reach the module's compile/test classpaths but a `testImplementation`
      # one must stay off the main compile classpath. The module's test suite
      # runs through JUnitCore (the runner named by testClass, the test class
      # passed in testArgs), so a broken assertion has to fail the build.
      - name: Resolve scoped deps into the plugin's classpath buckets
        working-directory: Uliab
        run: |
          set -euxo pipefail
          mkdir -p /tmp/jvm-junit/src
          cat > /tmp/jvm-junit/src/App.java <<'JAVA'
          public class App {
              public static String message() {
                  return org.slf4j.LoggerFactory.class.getSimpleName();
              }
          }
          JAVA
          cat > /tmp/jvm-junit/src/AppTest.java <<'JAVA'
          import org.junit.Test;
          import static org.junit.Assert.assertEquals;
          public class AppTest {
              @Test
              public void compiledAgainstSlf4j() {
                  assertEquals("LoggerFactory", App.message());
              }
          }
          JAVA
          cat > /tmp/jvm-junit/build.ulb <<'ULB'
          deps {
            implementation "org.slf4j:slf4j-api:2.0.16"
            testImplementation "junit:junit:4.13.2"
            testImplementation "org.hamcrest:hamcrest-core:1.3"
          }
          jvm {
            sources = ["src/App.java"]
            classesDir = "build/classes"
            jarFile = "build/app.jar"
            testSources = ["src/AppTest.java"]
            testClassesDir = "build/test-classes"
            testClass = "org.junit.runner.JUnitCore"
            testArgs = ["AppTest"]
          }
          ULB
          printf 'plugins {\n  jvm = "ulite/jvm" @ "0.6.0"\n}\n' > /tmp/jvm-junit/libs.ulb
          cp ../ulb-plugins/target/wasm32-wasip2/release/jvm_plugin.wasm /tmp/jvm-junit/jvm_plugin.wasm
          cat > /tmp/jvm-junit/index.json <<'JSON'
          {
            "schema_version": 1,
            "plugins": {
              "ulite/jvm": {
                "versions": {
                  "0.6.0": {
                    "abi": { "min": "0.7", "max": "0.7" },
                    "artifact_url": "jvm_plugin.wasm"
                  }
                }
              }
            }
          }
          JSON
          cache="$(mktemp -d)"
          uliab="$(pwd)/target/debug/uliab"
          resolve() {
            "$uliab" deps resolve --project /tmp/jvm-junit --cache-dir "$cache"
          }
          resolved="$(resolve)"
          compile_bucket="$(sed -n '/^compile:/,/^runtime:/p' <<<"$resolved")"
          test_compile_bucket="$(sed -n '/^testCompile:/,/^testRuntime:/p' <<<"$resolved")"
          grep -q 'slf4j-api-2.0.16.jar' <<<"$compile_bucket"
          ! grep -q 'junit/junit' <<<"$compile_bucket"
          grep -q 'junit/junit/4.13.2' <<<"$test_compile_bucket"
          grep -q 'slf4j-api-2.0.16.jar' <<<"$test_compile_bucket"
          build() {
            "$uliab" build --project /tmp/jvm-junit \
              --registry /tmp/jvm-junit/index.json --cache-dir "$cache"
          }
          first="$(build)"
          echo "$first"
          grep -q '4 ran, 0 up-to-date' <<<"$first"
          # A broken assertion must surface as a task failure, not a green build.
          sed -i 's/"LoggerFactory", App.message()/"NOPE", App.message()/' /tmp/jvm-junit/src/AppTest.java
          if build; then
            echo "a failing JUnit assertion did not fail the build"
            exit 1
          fi
          sed -i 's/"NOPE", App.message()/"LoggerFactory", App.message()/' /tmp/jvm-junit/src/AppTest.java
          # Removing the implementation dep must break main compilation, proving
          # testImplementation jars do not leak onto the main compile classpath.
          sed -i '/implementation "org.slf4j:slf4j-api:2.0.16"/d' /tmp/jvm-junit/build.ulb
          if build; then
            echo "a missing implementation dep did not fail main compilation"
            exit 1
          fi

  jvm-runner-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ulb-plugins

      - name: Checkout Uliab (plugin sdk + uliab host)
        uses: actions/checkout@v4
        with:
          repository: Ulite-Team/Uliab
          path: Uliab
          token: ${{ secrets.ULITE_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Build jvm-plugin
        working-directory: ulb-plugins
        run: cargo build -p jvm-plugin --release --target wasm32-wasip2

      - name: Build the uliab host
        working-directory: Uliab
        run: cargo build -p uliab

      # The generated-runner path: `testRunner = "junit-platform"` makes the
      # plugin write a JUnit Platform Launcher-API runner over the test
      # classes directory, so no testClass/testArgs or console-standalone jar
      # is needed and whatever engine the testImplementation deps resolve is
      # discovered. A Jupiter engine proves discovery and the exit-code
      # contract: a broken assertion fails the build.
      - name: Generated runner discovers and runs Jupiter tests
        working-directory: Uliab
        run: |
          set -euxo pipefail
          mkdir -p /tmp/jvm-runner/src
          cat > /tmp/jvm-runner/src/App.java <<'JAVA'
          public class App {
              public static String greet() {
                  return "hello";
              }
          }
          JAVA
          cat > /tmp/jvm-runner/src/AppTest.java <<'JAVA'
          import org.junit.jupiter.api.Test;
          import static org.junit.jupiter.api.Assertions.assertEquals;
          class AppTest {
              @Test
              void greets() {
                  assertEquals("hello", App.greet());
              }
          }
          JAVA
          cat > /tmp/jvm-runner/build.ulb <<'ULB'
          deps {
            implementation "org.slf4j:slf4j-api:2.0.16"
            testImplementation "org.junit.platform:junit-platform-launcher:1.11.4"
            testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
          }
          jvm {
            sources = ["src/App.java"]
            classesDir = "build/classes"
            jarFile = "build/app.jar"
            testSources = ["src/AppTest.java"]
            testClassesDir = "build/test-classes"
            testRunner = "junit-platform"
          }
          ULB
          printf 'plugins {\n  jvm = "ulite/jvm" @ "0.6.0"\n}\n' > /tmp/jvm-runner/libs.ulb
          cp ../ulb-plugins/target/wasm32-wasip2/release/jvm_plugin.wasm /tmp/jvm-runner/jvm_plugin.wasm
          cat > /tmp/jvm-runner/index.json <<'JSON'
          {
            "schema_version": 1,
            "plugins": {
              "ulite/jvm": {
                "versions": {
                  "0.6.0": {
                    "abi": { "min": "0.7", "max": "0.7" },
                    "artifact_url": "jvm_plugin.wasm"
                  }
                }
              }
            }
          }
          JSON
          cache="$(mktemp -d)"
          uliab="$(pwd)/target/debug/uliab"
          resolve() {
            "$uliab" deps resolve --project /tmp/jvm-runner --cache-dir "$cache"
          }
          resolved="$(resolve)"
          compile_bucket="$(sed -n '/^compile:/,/^runtime:/p' <<<"$resolved")"
          test_compile_bucket="$(sed -n '/^testCompile:/,/^testRuntime:/p' <<<"$resolved")"
          grep -q 'slf4j-api-2.0.16.jar' <<<"$compile_bucket"
          ! grep -q 'junit' <<<"$compile_bucket"
          grep -q 'junit-platform-launcher-1.11.4.jar' <<<"$test_compile_bucket"
          grep -q 'junit-jupiter-5.11.4.jar' <<<"$test_compile_bucket"
          grep -q 'junit-platform-engine' <<<"$test_compile_bucket"
          build() {
            "$uliab" build --project /tmp/jvm-runner \
              --registry /tmp/jvm-runner/index.json --cache-dir "$cache"
          }
          first="$(build)"
          echo "$first"
          grep -q '5 ran, 0 up-to-date' <<<"$first"
          test -f /tmp/jvm-runner/build/generated-test-src/ulite/TestRunner.java
          test -f /tmp/jvm-runner/build/test-classes/ulite/TestRunner.class
          grep -q '0 ran, 5 up-to-date' <<<"$(build)"
          # A broken assertion must surface as a task failure, not a green
          # build, and a test-source change must rerun only the test chain.
          sed -i 's/"hello", App.greet()/"NOPE", App.greet()/' /tmp/jvm-runner/src/AppTest.java
          if build > /tmp/jvm-runner/fail.log 2>&1; then
            echo "a failing JUnit assertion did not fail the build"
            exit 1
          fi
          grep -q 'AssertionFailedError' /tmp/jvm-runner/fail.log
          sed -i 's/"NOPE", App.greet()/"hello", App.greet()/' /tmp/jvm-runner/src/AppTest.java
          grep -q '2 ran, 3 up-to-date' <<<"$(build)"
          grep -q '0 ran, 5 up-to-date' <<<"$(build)"
          jar tf /tmp/jvm-runner/build/app.jar | grep -q 'App.class'
          if jar tf /tmp/jvm-runner/build/app.jar | grep -q 'AppTest'; then
            echo "the app jar must not contain the test classes"
            exit 1
          fi

  jvm-ksp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ulb-plugins

      - name: Checkout Uliab (plugin sdk + uliab host)
        uses: actions/checkout@v4
        with:
          repository: Ulite-Team/Uliab
          path: Uliab
          token: ${{ secrets.ULITE_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Build jvm-plugin
        working-directory: ulb-plugins
        run: cargo build -p jvm-plugin --release --target wasm32-wasip2

      - name: Build the uliab host
        working-directory: Uliab
        run: cargo build -p uliab

      - name: Install kotlinc
        run: |
          curl -sSLo /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"

      # A Kotlin module whose ksp deps route through the processor classpath:
      # the ksp task runs the real KSP2 tool against the sources, the
      # generated Kotlin feeds kotlinc, and assemble packages the classes.
      # The fixture processor is built from this repo into a file:// maven
      # layout, which the host's --repo flag adds ahead of Google/Maven
      # Central (where the KSP2 toolchain jar comes from).
      - name: Build a Kotlin module with ksp into a jar
        working-directory: Uliab
        run: |
          set -euxo pipefail
          bash ../ulb-plugins/fixtures/ksp-hello/build-fixture.sh /tmp/ksp-m2
          mkdir -p /tmp/ksp-app/src
          cat > /tmp/ksp-app/src/Main.kt <<'KOTLIN'
          package app

          import ulite.hello.Hello
          import ulite.hello.generated.greetings

          @Hello
          class Main

          fun main() {
              println(greetings)
          }
          KOTLIN
          cat > /tmp/ksp-app/build.ulb <<'ULB'
          deps {
            implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
            implementation "ulite:ksp-hello:1.0.0"
            ksp "ulite:ksp-hello:1.0.0"
            ksp "com.google.devtools.ksp:symbol-processing-aa:2.2.0-2.0.2"
          }
          jvm {
            sources = ["src/Main.kt"]
            classesDir = "build/classes"
            jarFile = "build/app.jar"
          }
          ULB
          printf 'plugins {\n  jvm = "ulite/jvm" @ "0.6.0"\n}\n' > /tmp/ksp-app/libs.ulb
          cp ../ulb-plugins/target/wasm32-wasip2/release/jvm_plugin.wasm /tmp/ksp-app/jvm_plugin.wasm
          cat > /tmp/ksp-app/index.json <<'JSON'
          {
            "schema_version": 1,
            "plugins": {
              "ulite/jvm": {
                "versions": {
                  "0.6.0": {
                    "abi": { "min": "0.7", "max": "0.7" },
                    "artifact_url": "jvm_plugin.wasm"
                  }
                }
              }
            }
          }
          JSON
          cache="$(mktemp -d)"
          uliab="$(pwd)/target/debug/uliab"
          build() {
            "$uliab" build --project /tmp/ksp-app \
              --registry /tmp/ksp-app/index.json --cache-dir "$cache" --repo /tmp/ksp-m2
          }
          first="$(build)"
          echo "$first"
          grep -q '3 ran, 0 up-to-date' <<<"$first"
          test -f /tmp/ksp-app/build/generated/ksp/kotlin/ulite/hello/generated/HelloGenerated.kt
          test -f /tmp/ksp-app/build/classes/ulite/hello/generated/HelloGeneratedKt.class
          grep -q '0 ran, 3 up-to-date' <<<"$(build)"
          runtime="$( \
            "$uliab" deps resolve --project /tmp/ksp-app --cache-dir "$cache" --repo /tmp/ksp-m2 \
            | sed -n '/^runtime:/,/^processor:/p' | grep -v '^runtime:\|^processor:' | sed 's/^  //' | tr '\n' ':' \
          )"
          output="$(java -cp "/tmp/ksp-app/build/app.jar:$runtime" app.MainKt)"
          test "$output" = "[hello from ksp for Main]"
          sed -i 's/println(greetings)/println("second run"); println(greetings)/' /tmp/ksp-app/src/Main.kt
          grep -q '3 ran, 0 up-to-date' <<<"$(build)"
          output="$(java -cp "/tmp/ksp-app/build/app.jar:$runtime" app.MainKt)"
          grep -q 'second run' <<<"$output"

  kmp-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ulb-plugins

      - name: Checkout Uliab (plugin sdk + uliab host)
        uses: actions/checkout@v4
        with:
          repository: Ulite-Team/Uliab
          path: Uliab
          token: ${{ secrets.ULITE_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Build kmp-plugin
        working-directory: ulb-plugins
        run: cargo build -p kmp-plugin --release --target wasm32-wasip2

      - name: Build the uliab host
        working-directory: Uliab
        run: cargo build -p uliab

      - name: Install kotlinc
        run: |
          curl -sSLo /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"

      # The jvm target of a kmp module, built end to end against a real
      # kotlinc: commonMain's kotlin compiles against the shared source
      # set's own dep (resolved from a local maven repo), jvmMain's java
      # and kotlin compile after it, and assemble packs both source sets.
      # Running the packaged main proves the commonMain dep reached the
      # classpath at runtime too. Because the plugin consumes the host's
      # per-source-set classpaths (`classpathSourceSets`), a module-level
      # `deps {}` block must NOT satisfy a source-set import — the host
      # checks out Uliab `main`, which carries per-source-set resolution.
      - name: Build a kmp module's jvm target into a jar
        working-directory: Uliab
        run: |
          set -euxo pipefail
          mkdir -p /tmp/kmp-m2/com/example/lib/1.0 /tmp/kmp-libjar/com/example/lib
          cat > /tmp/kmp-m2/com/example/lib/1.0/lib-1.0.pom <<'POM'
          <?xml version="1.0"?><project><modelVersion>4.0.0</modelVersion><groupId>com.example</groupId><artifactId>lib</artifactId><version>1.0</version></project>
          POM
          printf 'package com.example.lib;\npublic class Lib { public static String message() { return "from the shared dep"; } }\n' > /tmp/kmp-libjar/com/example/lib/Lib.java
          javac -d /tmp/kmp-libjar /tmp/kmp-libjar/com/example/lib/Lib.java
          (cd /tmp/kmp-libjar && jar cf /tmp/kmp-m2/com/example/lib/1.0/lib-1.0.jar com/example/lib/Lib.class)
          mkdir -p /tmp/kmp/src/commonMain /tmp/kmp/src/jvmMain
          cat > /tmp/kmp/src/commonMain/Shared.kt <<'KOTLIN'
          package shared
          fun greet(): String = com.example.lib.Lib.message()
          KOTLIN
          cat > /tmp/kmp/src/jvmMain/Helper.java <<'JAVA'
          package app;
          public class Helper {
              public static String decorate(String s) { return "[" + s + "]"; }
          }
          JAVA
          cat > /tmp/kmp/src/jvmMain/Main.kt <<'KOTLIN'
          package app
          fun main() { println(Helper.decorate(shared.greet())) }
          KOTLIN
          cat > /tmp/kmp/build.ulb <<'ULB'
          kmp {
            commonMain {
              sources = ["src/commonMain/Shared.kt"]
              deps { implementation "com.example:lib:1.0" }
            }
            jvmMain {
              sources = ["src/jvmMain/Helper.java", "src/jvmMain/Main.kt"]
            }
            jvm {
              classesDir = "build/classes"
              jarFile = "build/app.jar"
            }
          }
          ULB
          printf 'plugins {\n  kmp = "ulite/kmp" @ "0.2.0"\n}\n' > /tmp/kmp/libs.ulb
          cp ../ulb-plugins/target/wasm32-wasip2/release/kmp_plugin.wasm /tmp/kmp/kmp_plugin.wasm
          cat > /tmp/kmp/index.json <<'JSON'
          {
            "schema_version": 1,
            "plugins": {
              "ulite/kmp": {
                "versions": {
                  "0.2.0": {
                    "abi": { "min": "0.7", "max": "0.7" },
                    "artifact_url": "kmp_plugin.wasm"
                  }
                }
              }
            }
          }
          JSON
          cache="$(mktemp -d)"
          uliab="$(pwd)/target/debug/uliab"
          build() {
            "$uliab" build --project /tmp/kmp \
              --registry /tmp/kmp/index.json --cache-dir "$cache" --repo /tmp/kmp-m2
          }
          first="$(build)"
          echo "$first"
          grep -q '3 ran, 0 up-to-date' <<<"$first"
          jar tf /tmp/kmp/build/app.jar | grep -q 'shared/SharedKt.class'
          jar tf /tmp/kmp/build/app.jar | grep -q 'app/Helper.class'
          jar tf /tmp/kmp/build/app.jar | grep -q 'app/MainKt.class'
          output="$(java -cp "/tmp/kmp/build/app.jar:/tmp/kmp-m2/com/example/lib/1.0/lib-1.0.jar:/opt/kotlinc/lib/kotlin-stdlib.jar" app.MainKt)"
          test "$output" = "[from the shared dep]"
          # The host resolves each source set's deps independently.
          resolved="$("$uliab" deps resolve --project /tmp/kmp --cache-dir "$cache" --repo /tmp/kmp-m2)"
          echo "$resolved"
          grep -q '^kmp.commonMain:' <<<"$resolved"
          # An unchanged build from another working directory is fully
          # up-to-date: derived paths resolve against the injected projectDir.
          cd /
          grep -q '0 ran, 3 up-to-date' <<<"$(build)"
          cd /tmp/kmp
          # A module-level dep must not satisfy a source-set import: the
          # plugin reads `classpathSourceSets`, not the module's own deps.
          cat > /tmp/kmp/build.ulb <<'ULB'
          deps {
            implementation "com.example:lib:1.0"
          }
          kmp {
            commonMain {
              sources = ["src/commonMain/Shared.kt"]
            }
            jvmMain {
              sources = ["src/jvmMain/Helper.java", "src/jvmMain/Main.kt"]
            }
            jvm {
              classesDir = "build/classes"
              jarFile = "build/app.jar"
            }
          }
          ULB
          if build > /tmp/kmp/toplevel.log 2>&1; then
            echo "a module-level dep satisfied a source-set import"
            exit 1
          fi
          grep -q 'unresolved reference' /tmp/kmp/toplevel.log
          # An unsupported source set fails configure with a named error.
          cat > /tmp/kmp/build.ulb <<'ULB'
          kmp {
            androidMain {
              sources = ["src/jvmMain/Helper.java"]
            }
            jvm {
              classesDir = "build/classes"
              jarFile = "build/app.jar"
            }
          }
          ULB
          if build > /tmp/kmp/androidset.log 2>&1; then
            echo "an unsupported source set did not fail the build"
            exit 1
          fi
          grep -q "the 'androidMain' source set is not compiled by the jvm target" /tmp/kmp/androidset.log

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ulb-plugins

      - name: Checkout Uliab (plugin sdk + uliab host)
        uses: actions/checkout@v4
        with:
          repository: Ulite-Team/Uliab
          path: Uliab
          token: ${{ secrets.ULITE_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      - name: Build android-plugin
        working-directory: ulb-plugins
        run: cargo build -p android-plugin --release --target wasm32-wasip2

      - name: Build the uliab host
        working-directory: Uliab
        run: cargo build -p uliab

      # Packaging is exercised against a real SDK: ubuntu-latest ships an
      # Android SDK with sdkmanager, and this job installs the exact
      # build-tools release and platform the module declares. That makes
      # the job ~150MB of download, but a fake SDK cannot run the real
      # aapt2/d8 chain this plugin now registers. The module mirrors a real
      # app: a manifest with an activity, res/ with a layout and strings,
      # and a Main.java that references android.* types and R.* ids — so a
      # pass means resources were merged, R.java generated and compiled,
      # classes dexed, and the dex grafted into the apk.
      - name: Install Android platform and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Build an android module through the packaging chain
        working-directory: Uliab
        run: |
          set -euxo pipefail
          mkdir -p /tmp/android/src /tmp/android/res/layout /tmp/android/res/values
          cat > /tmp/android/src/Main.java <<'JAVA'
          package com.example.ulite;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;

          public class Main extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  ((TextView) findViewById(R.id.greeting)).setText(R.string.hello);
              }
          }
          JAVA
          cat > /tmp/android/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.ulite">
              <application android:label="@string/app_name">
                  <activity android:name=".Main" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          cat > /tmp/android/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <TextView
                  android:id="@+id/greeting"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content" />
          </LinearLayout>
          XML
          cat > /tmp/android/res/values/strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Uliab CI Example</string>
              <string name="hello">Hello from the CI apk</string>
          </resources>
          XML
          cat > /tmp/android/build.ulb <<'ULB'
          android {
            compileSdk = 36
            minSdk = 21
            namespace = "com.example.ulite"
            sources = ["src/Main.java"]
            manifest = "AndroidManifest.xml"
            resDir = "res"
          }
          ULB
          printf 'plugins {\n  android = "ulite/android" @ "0.3.0"\n}\n' > /tmp/android/libs.ulb
          cp ../ulb-plugins/target/wasm32-wasip2/release/android_plugin.wasm /tmp/android/android_plugin.wasm
          cat > /tmp/android/index.json <<'JSON'
          {
            "schema_version": 1,
            "plugins": {
              "ulite/android": {
                "versions": {
                  "0.3.0": {
                    "abi": { "min": "0.7", "max": "0.7" },
                    "artifact_url": "android_plugin.wasm"
                  }
                }
              }
            }
          }
          JSON
          cache="$(mktemp -d)"
          uliab="$(pwd)/target/debug/uliab"
          build() {
            "$uliab" build --project /tmp/android \
              --registry /tmp/android/index.json --cache-dir "$cache" --android-sdk "$ANDROID_HOME"
          }
          first="$(build)"
          echo "$first"
          grep -q '18 ran, 0 up-to-date' <<<"$first"
          # The apk is complete: manifest, merged resources, resource table,
          # and the dex grafted onto the aapt2 output.
          unzip -l /tmp/android/build/android/debug/app-debug.apk > /tmp/android/apk.list
          grep -q 'AndroidManifest.xml' /tmp/android/apk.list
          grep -q 'res/layout/activity_main.xml' /tmp/android/apk.list
          grep -q 'resources.arsc' /tmp/android/apk.list
          grep -q 'classes.dex' /tmp/android/apk.list
          test -f /tmp/android/build/android/debug/R/com/example/ulite/R.java
          # An unchanged build from another working directory is fully
          # up-to-date: derived paths resolve against the injected
          # projectDir, never the invocation directory.
          cd /
          grep -q '0 ran, 18 up-to-date' <<<"$(build)"
          # A resource change reruns the resource chain and everything that
          # consumes it, but not the mkdirs.
          cd /tmp/android
          sed -i 's/Uliab CI Example/Uliab CI Example v2/' res/values/strings.xml
          grep -q '13 ran, 5 up-to-date' <<<"$(build)"
          # A source change reruns compile and the dex/package chain only.
          sed -i 's|setContentView(R.layout.activity_main);|setContentView(R.layout.activity_main); // v2|' src/Main.java
          grep -q '8 ran, 10 up-to-date' <<<"$(build)"
          # A compile level the SDK does not have must fail configure, not
          # javac, proving discovery ran inside the plugin.
          sed -i 's/compileSdk = 36/compileSdk = 99/' build.ulb
          if build > /tmp/android/err.log 2>&1; then
            echo "a missing platform jar did not fail the build"
            exit 1
          fi
          grep -q 'no android.jar for compileSdk 99' /tmp/android/err.log
